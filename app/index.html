<!doctype html>
<html lang="ru" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Refkit — каркас библиотеки</title>
      <!-- Тема до загрузки приложения, чтобы не мигало: по умолчанию тёмная, выбор — в localStorage (AppSidebar) -->
    <script>try { if (localStorage.getItem('refkit.theme') === 'light') document.documentElement.classList.remove('dark') } catch {}</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
